appId: com.hzz2z.modureader
productName: 墨读
publish:
  provider: github
  owner: HZZ2Z
  repo: Updf
asar: true
directories:
  output: dist
  buildResources: build
files:
  - desktop/**/*
  - package.json
  - "!node_modules/**/*"
extraResources:
  - from: .desktop-runtime/server
    to: app-server
    filter:
      - "**/*"
      - "!node_modules/**/*"
  - from: .desktop-runtime/server/node_modules
    to: app-server/node_modules
    filter:
      - "**/*"
  - from: build/icon.svg
    to: assets/icon.svg
  - from: node_modules
    to: updater/node_modules
    filter:
      - electron-updater/**/*
      - builder-util-runtime/**/*
      - fs-extra/**/*
      - js-yaml/**/*
      - lazy-val/**/*
      - lodash.escaperegexp/**/*
      - lodash.isequal/**/*
      - semver/**/*
      - tiny-typed-emitter/**/*
      - debug/**/*
      - sax/**/*
      - graceful-fs/**/*
      - jsonfile/**/*
      - universalify/**/*
      - argparse/**/*
      - ms/**/*
linux:
  target:
    - AppImage
    - deb
  executableName: modu-reader
  executableArgs:
    - "%F"
  syncDesktopName: true
  icon: build/icon.svg
  category: Office;Viewer
  maintainer: HZZ2Z <HZZ2Z@users.noreply.github.com>
  mimeTypes:
    - application/pdf
artifactName: "Modu-${version}-x86_64.${ext}"
